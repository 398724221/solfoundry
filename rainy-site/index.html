<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rainy Living World</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaf0;color:#18324a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.loading{text-align:center}.sun{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;background:linear-gradient(145deg,#fff1a9,#8fd8ff);box-shadow:0 15px 45px rgba(93,166,203,.22);animation:p 1.3s ease-in-out infinite alternate}@keyframes p{to{transform:translateY(-6px) scale(1.04)}}small{color:#657b8e}</style>
</head>
<body><div class="loading"><div class="sun"></div><strong>正在打开 Rainy Living World</strong><br><small>把今天真正重要的事情理顺。</small></div>
<script>
(async()=>{try{const names=['part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt','part-07.txt','part-08.txt','part-09.txt','part-10.txt','part-11.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div class="loading"><strong>网站加载失败</strong><br><small>请刷新页面重试。</small></div>'}})();
</script></body></html>
